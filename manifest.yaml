  - LICENSE.txt

models:
  - hetzner_invoice.ts

# Report paths resolve against the default base (extensions/reports/).
reports:
  - hetzner-spend.ts

# Empty platforms == universal. Extracts PDF text via the bundled pure-JS unpdf
# library (no host binaries shelled out), so it runs anywhere.
platforms: []

labels:
  - hetzner-invoice
  - finops
  - expenses
  - hetzner
